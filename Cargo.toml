[package]
name = "hs-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hs-gen"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["hazmat", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
quickcheck = "1"
quickcheck_macros = "1"
tempfile = "3"

[profile.release]
strip = true
opt-level = "z"
lto = true
